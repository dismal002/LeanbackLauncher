plugins {
    id 'com.android.application'
}

android {
    namespace 'com.dismal.android.leanbacklauncher'
    compileSdk 34

    defaultConfig {
        applicationId 'com.dismal.android.leanbacklauncher'
        minSdk 21
        targetSdk 34
        versionCode 2244932
        versionName "1.1.3.2244932"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'androidx.appcompat:appcompat:1.5.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.0'
    implementation 'androidx.palette:palette:1.0.0'
    implementation 'androidx.leanback:leanback:1.0.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.annotation:annotation:1.6.0'
    
    // Align Kotlin stdlib versions to prevent duplicate class conflicts
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.8.0'
    implementation 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.0'
    implementation 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.0'

    // Launcher3 All-Apps drawer
    implementation project(':launcher3-m')
}
